name: Android

# Capacitor shell: web bundle -> cap sync -> debug APK + release AAB. There is no local JDK/SDK
# on the dev machine, so this workflow is the only place the Android build is verified.
on:
  push:
    branches:
      - main
      - 'phase-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash gives -eo pipefail, so a failing tool inside a pipe fails the step.
    shell: bash

env:
  BUILD_TOOLS_VERSION: '36.0.0'
  ANDROID_PLATFORM: 'android-36'

jobs:
  android:
    name: Debug APK + release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships an Android SDK with its licences already accepted; make sure the
      # platform and build-tools this project compiles against are present.
      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          "$sdkmanager" --install "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS_VERSION" "platform-tools" | tr '\r' '\n' | sed '/^\[/d; /^ *$/d'
          test -d "$ANDROID_HOME/platforms/$ANDROID_PLATFORM"
          test -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          echo "AAPT2=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Capacitor sync
        run: npx cap sync android

      # Optional upload signing. Secrets are only ever passed through env and the keystore is
      # written to $RUNNER_TEMP; with any of the four missing the release AAB stays unsigned.
      - name: Release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            keystore="$RUNNER_TEMP/upload.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            chmod 600 "$keystore"
            echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release AAB will be signed with the upload keystore."
          else
            if [ -n "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
              echo "::warning::Only some of the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets are set; building an unsigned release AAB."
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets: the release AAB will be unsigned."
          fi

      - name: Gradle assembleDebug bundleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: APK badging
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          badging="$("$AAPT2" dump badging "$apk")"
          # Badging has no orientation field; read it from the compiled manifest instead.
          raw="$("$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" | grep -m1 'screenOrientation' | sed -E 's/.*=(\(type 0x[0-9a-fA-F]+\))?//' || true)"
          orientation="not set (${raw:-no screenOrientation attribute})"
          if [[ "$raw" =~ ^(0x[0-9a-fA-F]+|[0-9]+)$ ]]; then
            case "$((raw))" in
              0) orientation=landscape ;; 1) orientation=portrait ;; 4) orientation=sensor ;;
              6) orientation=sensorLandscape ;; 7) orientation=sensorPortrait ;; 9) orientation=reversePortrait ;;
              12) orientation=userPortrait ;; *) orientation="other (screenOrientation=$raw)" ;;
            esac
          fi
          report="$RUNNER_TEMP/badging.md"
          {
            echo "## Debug APK badging"
            echo '```'
            grep -E '^(package|sdkVersion|targetSdkVersion|uses-permission|application-label|launchable-activity):' <<< "$badging" || true
            grep -E 'android\.hardware\.screen\.(portrait|landscape)' <<< "$badging" || true
            echo "orientation: $orientation"
            echo '```'
          } > "$report"
          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage artifacts
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          out="$RUNNER_TEMP/android-out"
          mkdir -p "$out/apk" "$out/aab"
          if [ "$SIGNED" = true ]; then kind=signed; else kind=unsigned; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$out/apk/app-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$out/aab/crowd-shooter-release-$kind.aab"
          ls -l "$out/apk" "$out/aab"
          echo "ANDROID_OUT=$out" >> "$GITHUB_ENV"
          echo "Release AAB: **$kind** (crowd-shooter-release-$kind.aab)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crowd-shooter-debug-apk
          path: ${{ env.ANDROID_OUT }}/apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crowd-shooter-release-aab
          path: ${{ env.ANDROID_OUT }}/aab/*.aab
          if-no-files-found: error
          retention-days: 14
